# Two separate containers (Flask backend and Streamlit frontend), each built from its own Dockerfile.
# The frontend shares the backend's Docker network namespace (network_mode: service:backend),
# so it reaches the API at localhost:7860 without depending on container-to-container bridge traffic,
# which GitHub Codespaces blocks.
services:
  backend:
    build: ./backend_files
    container_name: superkart-backend
    ports:
      - "7860:7860"                     # Flask API
      - "8501:8501"                     # Streamlit app (published here because the frontend shares this network namespace)

  frontend:
    build: ./frontend_files
    container_name: superkart-frontend
    network_mode: "service:backend"     # join the backend container's network namespace
    environment:
      - BACKEND_URL=http://localhost:7860
    depends_on:
      - backend
