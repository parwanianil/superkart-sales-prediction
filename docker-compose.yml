# Two separate containers (Flask backend and Streamlit frontend) connected through a named Docker network
services:
  backend:
    build: ./backend_files              # built from the backend Dockerfile
    container_name: superkart-backend
    ports:
      - "7860:7860"                     # Flask API, forwarded by Codespaces
    networks:
      - superkart-network               # (1) attach the backend to the network

  frontend:
    build: ./frontend_files             # built from the frontend Dockerfile
    container_name: superkart-frontend
    ports:
      - "8501:8501"                     # Streamlit app, forwarded by Codespaces
    environment:
      - BACKEND_URL=http://backend:7860 # the frontend reaches the backend by its service name on the network
    depends_on:
      - backend
    networks:
      - superkart-network               # (1) attach the frontend to the same network

# (2) Create the network shared by both containers
networks:
  superkart-network:
    name: superkart-network             # fixed name, so it is not prefixed with the project name
    driver: bridge
